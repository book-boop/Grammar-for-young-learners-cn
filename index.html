<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GRAMMAR for young learners</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,700;0,800;0,900;1,700&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Nunito', -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #e8d5c4 0%, #dce7f3 35%, #d6e4f0 68%, #ebd5dd 100%);
      padding: 20px;
      color: #1e293b;
    }

    .board {
      width: 100%;
      max-width: 960px;
      min-height: 600px;
      background: linear-gradient(180deg, #f3f8fc 0%, #e6eff8 100%);
      border: 4px solid #ffffff;
      border-radius: 28px;
      box-shadow: 0 18px 45px rgba(30, 58, 95, 0.12);
      padding: 40px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      position: relative;
      overflow-y: auto;
    }

    /* 标题区块 */
    .header-box {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      margin-top: 4px;
    }

    .paren {
      font-size: 64px;
      font-weight: 300;
      color: #94a3b8;
      line-height: 1;
      user-select: none;
    }

    .title-group {
      text-align: center;
    }

    .title-main {
      font-size: clamp(32px, 5vw, 44px);
      font-weight: 900;
      letter-spacing: 3px;
      color: #17375e;
      line-height: 1.05;
    }

    .title-sub {
      font-size: clamp(18px, 2.5vw, 23px);
      font-weight: 700;
      font-style: italic;
      color: #2b7de9;
      margin-top: 2px;
    }

    .title-arc {
      width: 240px;
      height: 12px;
      border-top: 2px solid #cbd5e1;
      border-radius: 50% 50% 0 0;
      margin: 10px auto 0;
    }

    .view {
      width: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
    }

    .view.active {
      display: flex;
    }

    /* 主页 3 本纯色书本样式 */
    .books-stage {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 28px;
      margin: 36px 0;
      flex-wrap: wrap;
    }

    .book-cover {
      width: 168px;
      height: 224px;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-weight: 900;
      font-size: 26px;
      letter-spacing: 1px;
      box-shadow: 0 12px 24px rgba(15, 23, 42, 0.14);
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      user-select: none;
      border: 3px solid rgba(255, 255, 255, 0.7);
    }

    .book-cover span {
      font-size: 14px;
      font-weight: 700;
      opacity: 0.9;
      margin-bottom: 4px;
    }

    .book-cover.b1 {
      background: linear-gradient(145deg, #fb923c, #ea580c);
      transform: rotate(-3deg);
    }

    .book-cover.b2 {
      background: linear-gradient(145deg, #38bdf8, #0284c7);
      transform: translateY(-6px);
    }

    .book-cover.b3 {
      background: linear-gradient(145deg, #f472b6, #db2777);
      transform: rotate(3deg);
    }

    .book-cover:hover {
      transform: translateY(-12px) scale(1.04) rotate(0deg);
      box-shadow: 0 18px 32px rgba(15, 23, 42, 0.2);
    }

    /* 通用白底胶囊按钮 */
    .pill-btn {
      background: #ffffff;
      color: #1e293b;
      border: 2px solid #e2e8f0;
      border-radius: 999px;
      padding: 14px 56px;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 1.5px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
      transition: all 0.2s ease;
    }

    .pill-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(15, 23, 42, 0.12);
      border-color: #cbd5e1;
    }

    /* 第二页：选书卡片 */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 24px;
      width: 100%;
      max-width: 820px;
      margin: 44px 0;
    }

    .book-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 28px 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.06);
      border: 2px solid transparent;
      transition: all 0.22s ease;
      min-height: 112px;
    }

    .book-card::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 10px;
    }

    .book-card.b1 { border-color: #fed7aa; }
    .book-card.b1::before { background: #f97316; }
    .book-card.b1 .card-title { color: #ea580c; }

    .book-card.b2 { border-color: #bae6fd; }
    .book-card.b2::before { background: #0284c7; }
    .book-card.b2 .card-title { color: #0369a1; }

    .book-card.b3 { border-color: #fbcfe8; }
    .book-card.b3::before { background: #db2777; }
    .book-card.b3 .card-title { color: #be185d; }

    .book-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 14px 28px rgba(15, 23, 42, 0.11);
    }

    .card-title {
      font-size: 26px;
      font-weight: 900;
    }

    /* 题库页面样式 */
    .quiz-wrapper {
      width: 100%;
      max-width: 780px;
      margin: 24px auto 16px;
      text-align: left;
    }

    .quiz-header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
    }

    .book-badge {
      font-size: 22px;
      font-weight: 900;
      color: #17375e;
    }

    .quiz-tabs {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .tab-btn {
      padding: 10px 20px;
      border-radius: 999px;
      border: 2px solid #cbd5e1;
      background: #ffffff;
      color: #334155;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: #17375e;
      border-color: #17375e;
      color: #ffffff;
    }

    /* 单题进度条 */
    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 15px;
      font-weight: 800;
      color: #17375e;
    }

    .progress-track {
      width: 100%;
      height: 10px;
      background: #dbeafe;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 18px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #2b7de9, #17375e);
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    .question-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 24px 26px;
      margin-bottom: 14px;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.06);
    }

    .cloze-context {
      background: #f1f5f9;
      border-left: 4px solid #2b7de9;
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 15px;
      line-height: 1.75;
      color: #334155;
      margin-bottom: 16px;
    }

    .question-title {
      font-weight: 800;
      color: #1e293b;
      margin-bottom: 16px;
      line-height: 1.55;
      font-size: 18px;
    }

    .option-list {
      display: grid;
      gap: 10px;
    }

    .option-btn {
      text-align: left;
      padding: 13px 18px;
      border-radius: 12px;
      border: 2px solid #e2e8f0;
      background: #f8fafc;
      cursor: pointer;
      font-size: 16px;
      font-family: inherit;
      font-weight: 700;
      color: #334155;
      transition: all 0.15s;
    }

    .option-btn:hover:not(:disabled) {
      border-color: #94a3b8;
      background: #f1f5f9;
    }

    .option-btn:disabled {
      cursor: default;
    }

    .option-btn.correct {
      border-color: #16a34a;
      background: #dcfce7;
      color: #15803d;
    }

    .option-btn.wrong {
      border-color: #dc2626;
      background: #fee2e2;
      color: #b91c1c;
    }

    .feedback-msg {
      margin-top: 14px;
      font-size: 15px;
      font-weight: 800;
      padding: 10px 14px;
      border-radius: 10px;
    }

    .feedback-msg.ok {
      background: #f0fdf4;
      color: #15803d;
    }

    .feedback-msg.err {
      background: #fef2f2;
      color: #b91c1c;
    }

    /* 配对连连看区块 */
    .matching-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 14px;
    }

    .match-col {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .match-item {
      padding: 14px 16px;
      border-radius: 12px;
      border: 2px solid #cbd5e1;
      background: #f8fafc;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
      text-align: center;
      transition: all 0.15s;
      user-select: none;
    }

    .match-item:hover {
      border-color: #94a3b8;
    }

    .match-item.active {
      border-color: #2563eb;
      background: #eff6ff;
      color: #1d4ed8;
    }

    .match-item.matched {
      border-color: #16a34a;
      background: #dcfce7;
      color: #15803d;
      pointer-events: none;
      opacity: 0.85;
    }

    .match-item.error {
      border-color: #dc2626;
      background: #fee2e2;
      color: #b91c1c;
    }

    .action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 20px;
    }

    .action-bar.center {
      justify-content: center;
    }

    .primary-btn {
      padding: 12px 26px;
      border-radius: 999px;
      border: none;
      background: #17375e;
      color: #ffffff;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .primary-btn:hover:not(:disabled) {
      opacity: 0.92;
    }

    .primary-btn:disabled {
      background: #cbd5e1;
      cursor: not-allowed;
    }

    .accent-btn {
      padding: 12px 26px;
      border-radius: 999px;
      border: none;
      background: #2b7de9;
      color: #ffffff;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .accent-btn:hover {
      opacity: 0.92;
    }

    .secondary-btn {
      padding: 11px 22px;
      border-radius: 999px;
      border: 2px solid #cbd5e1;
      background: #ffffff;
      color: #334155;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    .secondary-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .summary-box {
      background: #ffffff;
      border-radius: 20px;
      padding: 44px 28px;
      text-align: center;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.06);
    }

    .score-circle {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: #eff6ff;
      border: 4px solid #2b7de9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px;
      color: #17375e;
    }

    .placeholder-box {
      text-align: center;
      padding: 70px 20px;
      background: #ffffff;
      border-radius: 20px;
      margin: 24px 0;
      width: 100%;
      max-width: 560px;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.05);
    }

    @media (max-width: 720px) {
      .cards-grid {
        grid-template-columns: 1fr;
        max-width: 360px;
      }
      .matching-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="board">
    <!-- 顶部固定标题 -->
    <header class="header-box">
      <div class="paren">(</div>
      <div class="title-group">
        <div class="title-main">GRAMMAR</div>
        <div class="title-sub">for young learners</div>
        <div class="title-arc" id="title-arc" style="display: none;"></div>
      </div>
      <div class="paren">)</div>
    </header>

    <!-- 画面 1：主页 -->
    <main id="home-view" class="view active">
      <div class="books-stage">
        <div class="book-cover b1" onclick="goToSelect()">
          <span>BOOK</span>1
        </div>
        <div class="book-cover b2" onclick="goToSelect()">
          <span>BOOK</span>2
        </div>
        <div class="book-cover b3" onclick="goToSelect()">
          <span>BOOK</span>3
        </div>
      </div>
      <button class="pill-btn" onclick="goToSelect()">START</button>
    </main>

    <!-- 画面 2：选书目录 -->
    <section id="select-view" class="view">
      <div class="cards-grid">
        <div class="book-card b1" onclick="openBook(1)">
          <div class="card-title">Book 1</div>
        </div>
        <div class="book-card b2" onclick="openBook(2)">
          <div class="card-title">Book 2</div>
        </div>
        <div class="book-card b3" onclick="openBook(3)">
          <div class="card-title">Book 3</div>
        </div>
      </div>
      <button class="pill-btn" onclick="goToHome()">← 回到主页</button>
    </section>

    <!-- 画面 3：题库练习页 -->
    <section id="quiz-view" class="view">
      <div id="quiz-content" style="width: 100%; display: flex; flex-direction: column; align-items: center;"></div>
      <button class="pill-btn" style="margin-top: 16px;" onclick="goToSelect()">← 返回选书</button>
    </section>
  </div>

  <script>
    const PART1_SAMPLE_SIZE = 10; // 第一大题每次随机抽取题数

    let currentBookData = null;
    let currentTab = 'part1';
    let sampledPart1Questions = [];
    let currentQuestionIndex = 0;
    let userAnswers = {};
    let showPart1Summary = false;

    // 配对题状态
    let currentLevelIndex = 0;
    let selectedLeft = null;
    let selectedRight = null;
    let matchedCount = 0;

    function switchView(viewId) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById(viewId).classList.add('active');
      document.getElementById('title-arc').style.display = viewId === 'home-view' ? 'none' : 'block';
    }

    function goToHome() {
      switchView('home-view');
    }

    function goToSelect() {
      switchView('select-view');
    }

    // 洗牌函数 (Fisher-Yates)
    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    // 从题库中随机抽取 10 题
    function samplePart1Questions() {
      const { singleChoice = [], cloze } = currentBookData.part1_review;
      const pool = [];

      singleChoice.forEach(item => {
        pool.push({
          id: item.id,
          question: item.question,
          options: item.options,
          answer: item.answer,
          passage: null
        });
      });

      if (cloze && Array.isArray(cloze.questions)) {
        cloze.questions.forEach(item => {
          pool.push({
            id: item.id,
            question: `完形填空第 (${item.blankNumber}) 空：请选出最适合填入短文 (${item.blankNumber})_____ 的答案`,
            options: item.options,
            answer: item.answer,
            passage: cloze.passage
          });
        });
      }

      sampledPart1Questions = shuffleArray(pool).slice(0, PART1_SAMPLE_SIZE);
      currentQuestionIndex = 0;
      userAnswers = {};
      showPart1Summary = false;
    }

    // 直接读取同文件夹下的 book1.json、book2.json、book3.json
    async function openBook(bookId) {
      switchView('quiz-view');
      const quizContainer = document.getElementById('quiz-content');
      quizContainer.innerHTML = `<div class="placeholder-box"><p style="color:#64748b; font-weight:700;">正在加载题库...</p></div>`;

      try {
        const response = await fetch(`./book${bookId}.json`);
        if (!response.ok) throw new Error('Not found');
        currentBookData = await response.json();

        currentTab = 'part1';
        currentLevelIndex = 0;
        samplePart1Questions();

        renderQuizUI();
      } catch (err) {
        quizContainer.innerHTML = `
          <div class="placeholder-box">
            <h2 style="color:#17375e; font-size:28px; margin-bottom:12px;">Book ${bookId}</h2>
            <p style="font-size:18px; color:#64748b; font-weight:700;">题库还在制作中</p>
          </div>
        `;
      }
    }

    function renderQuizUI() {
      const quizContainer = document.getElementById('quiz-content');
      quizContainer.innerHTML = `
        <div class="quiz-wrapper">
          <div class="quiz-header-bar">
            <div class="book-badge">${currentBookData.title}</div>
            <div class="quiz-tabs">
              <button class="tab-btn ${currentTab === 'part1' ? 'active' : ''}" onclick="switchTab('part1')">
                ${currentBookData.part1_review.title}
              </button>
              <button class="tab-btn ${currentTab === 'part2' ? 'active' : ''}" onclick="switchTab('part2')">
                ${currentBookData.part2_matching.title}
              </button>
            </div>
          </div>
          <div id="tab-body"></div>
        </div>
      `;

      if (currentTab === 'part1') {
        renderPart1();
      } else {
        renderPart2();
      }
    }

    function switchTab(tab) {
      currentTab = tab;
      renderQuizUI();
    }

    // 第一大题：一题一题作答模式
    function renderPart1() {
      const tabBody = document.getElementById('tab-body');
      const totalQ = sampledPart1Questions.length;

      // 结算画面
      if (showPart1Summary) {
        let correctCount = 0;
        sampledPart1Questions.forEach(q => {
          if (userAnswers[q.id] === q.answer) correctCount++;
        });

        tabBody.innerHTML = `
          <div class="summary-box">
            <div class="score-circle">
              <span style="font-size:32px; font-weight:900; line-height:1;">${correctCount} / ${totalQ}</span>
              <span style="font-size:13px; font-weight:700; margin-top:4px;">答对题数</span>
            </div>
            <h3 style="font-size:22px; color:#17375e; margin-bottom:8px;">测验完成！</h3>
            <p style="color:#64748b; margin-bottom:24px;">你可以重新随机抽取 10 题再练习一次，或直接进入第二大题进行配对挑战。</p>
            <div class="action-bar center">
              <button class="secondary-btn" onclick="reviewPart1Answers()">回顾作答记录</button>
              <button class="primary-btn" onclick="resetPart1()">重新抽题测验</button>
              <button class="accent-btn" onclick="switchTab('part2')">前往第二大题 →</button>
            </div>
          </div>
        `;
        return;
      }

      const item = sampledPart1Questions[currentQuestionIndex];
      const chosenOpt = userAnswers[item.id];
      const hasAnswered = chosenOpt !== undefined;
      const progressPercent = ((currentQuestionIndex + 1) / totalQ) * 100;

      let feedbackHtml = '';
      if (hasAnswered) {
        if (chosenOpt === item.answer) {
          feedbackHtml = `<div class="feedback-msg ok">✓ 答对了！太棒了！</div>`;
        } else {
          const correctLetter = String.fromCharCode(65 + item.answer);
          feedbackHtml = `<div class="feedback-msg err">✕ 答错了，正确答案是 ${correctLetter}. ${item.options[item.answer]}</div>`;
        }
      }

      tabBody.innerHTML = `
        <div class="progress-header">
          <span>第 ${currentQuestionIndex + 1} / ${totalQ} 题</span>
          <span style="color:#64748b; font-size:13.5px;">已作答 ${Object.keys(userAnswers).length} / ${totalQ} 题</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" style="width: ${progressPercent}%"></div>
        </div>

        <div class="question-card">
          ${item.passage ? `<div class="cloze-context">${item.passage}</div>` : ''}
          <div class="question-title">${currentQuestionIndex + 1}. ${item.question}</div>
          <div class="option-list">
            ${item.options.map((opt, optIdx) => {
              let cls = 'option-btn';
              if (hasAnswered) {
                if (optIdx === item.answer) cls += ' correct';
                else if (optIdx === chosenOpt) cls += ' wrong';
              }
              return `<button class="${cls}" ${hasAnswered ? 'disabled' : ''} onclick="selectOption('${item.id}', ${optIdx})">
                ${String.fromCharCode(65 + optIdx)}. ${opt}
              </button>`;
            }).join('')}
          </div>
          ${feedbackHtml}
        </div>

        <div class="action-bar">
          <button class="secondary-btn" ${currentQuestionIndex === 0 ? 'disabled' : ''} onclick="prevQuestion()">
            ← 上一题
          </button>
          ${currentQuestionIndex < totalQ - 1
            ? `<button class="primary-btn" ${!hasAnswered ? 'disabled' : ''} onclick="nextQuestion()">下一题 →</button>`
            : `<button class="primary-btn" ${!hasAnswered ? 'disabled' : ''} onclick="finishPart1()">查看成绩结算</button>`
          }
        </div>
      `;
    }

    function selectOption(qId, optIdx) {
      if (userAnswers[qId] !== undefined) return;
      userAnswers[qId] = optIdx;
      renderPart1();
    }

    function prevQuestion() {
      if (currentQuestionIndex > 0) {
        currentQuestionIndex--;
        renderPart1();
      }
    }

    function nextQuestion() {
      if (currentQuestionIndex < sampledPart1Questions.length - 1) {
        currentQuestionIndex++;
        renderPart1();
      }
    }

    function finishPart1() {
      showPart1Summary = true;
      renderPart1();
    }

    function reviewPart1Answers() {
      showPart1Summary = false;
      currentQuestionIndex = 0;
      renderPart1();
    }

    function resetPart1() {
      samplePart1Questions();
      renderPart1();
    }

    // 第二大题：配对连连看
    function renderPart2() {
      const tabBody = document.getElementById('tab-body');
      const levels = currentBookData.part2_matching.levels;
      const levelData = levels[currentLevelIndex];

      selectedLeft = null;
      selectedRight = null;
      matchedCount = 0;

      const leftItems = levelData.pairs.map((p, idx) => ({ text: p.left, pairId: idx }));
      const rightItems = shuffleArray(
        levelData.pairs.map((p, idx) => ({ text: p.right, pairId: idx }))
      );

      tabBody.innerHTML = `
        <div class="question-card">
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
            <strong style="font-size:17px; color:#17375e;">关卡 ${levelData.level} / ${levels.length}：${levelData.topic}</strong>
            <span id="match-status" style="color:#64748b; font-size:14px; font-weight:700;">已完成 0 / ${levelData.pairs.length} 组</span>
          </div>
          <div class="matching-grid">
            <div class="match-col">
              ${leftItems.map((item, i) => `
                <div class="match-item" id="left-${i}" data-pair="${item.pairId}" onclick="handleMatchClick('left', ${i})">
                  ${item.text}
                </div>
              `).join('')}
            </div>
            <div class="match-col">
              ${rightItems.map((item, i) => `
                <div class="match-item" id="right-${i}" data-pair="${item.pairId}" onclick="handleMatchClick('right', ${i})">
                  ${item.text}
                </div>
              `).join('')}
            </div>
          </div>
          <div class="action-bar center" id="match-next-bar" style="display:none;">
            ${currentLevelIndex < levels.length - 1
              ? `<button class="primary-btn" onclick="nextMatchLevel()">下一关 →</button>`
              : `<button class="primary-btn" onclick="restartMatchLevels()">全部通关！再玩一次</button>`}
          </div>
        </div>
      `;
    }

    function handleMatchClick(side, index) {
      const el = document.getElementById(`${side}-${index}`);
      if (el.classList.contains('matched')) return;

      if (side === 'left') {
        if (selectedLeft) selectedLeft.classList.remove('active');
        selectedLeft = el;
        el.classList.add('active');
      } else {
        if (selectedRight) selectedRight.classList.remove('active');
        selectedRight = el;
        el.classList.add('active');
      }

      if (selectedLeft && selectedRight) {
        const leftPair = selectedLeft.getAttribute('data-pair');
        const rightPair = selectedRight.getAttribute('data-pair');
        const totalPairs = currentBookData.part2_matching.levels[currentLevelIndex].pairs.length;

        if (leftPair === rightPair) {
          selectedLeft.classList.remove('active');
          selectedRight.classList.remove('active');
          selectedLeft.classList.add('matched');
          selectedRight.classList.add('matched');
          matchedCount++;
          document.getElementById('match-status').textContent = `已完成 ${matchedCount} / ${totalPairs} 组`;

          if (matchedCount === totalPairs) {
            document.getElementById('match-next-bar').style.display = 'flex';
          }
        } else {
          const l = selectedLeft;
          const r = selectedRight;
          l.classList.add('error');
          r.classList.add('error');
          setTimeout(() => {
            l.classList.remove('active', 'error');
            r.classList.remove('active', 'error');
          }, 450);
        }
        selectedLeft = null;
        selectedRight = null;
      }
    }

    function nextMatchLevel() {
      currentLevelIndex++;
      renderPart2();
    }

    function restartMatchLevels() {
      currentLevelIndex = 0;
      renderPart2();
    }
  </script>
</body>
</html>
