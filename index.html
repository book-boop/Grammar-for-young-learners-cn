<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GRAMMAR for young learners</title>
  <!-- 載入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 載入 Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,600;0,700;0,800;0,900;1,600;1,700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy-dark: #102d4c;
      --blue-sub: #2274b8;
      --book1-color: #ef6c24;
      --book2-color: #0976bc;
      --book3-color: #e61c79;
    }

    body {
      font-family: 'Montserrat', 'Noto Sans TC', sans-serif;
      /* 還原圖片背景：柔和的藍紫與暖米色光暈漸層 */
      background: 
        radial-gradient(circle at 12% 85%, rgba(226, 214, 195, 0.85) 0%, transparent 45%),
        radial-gradient(circle at 88% 18%, rgba(235, 205, 225, 0.8) 0%, transparent 45%),
        radial-gradient(circle at 82% 88%, rgba(198, 200, 232, 0.85) 0%, transparent 45%),
        linear-gradient(135deg, #c2d4e8 0%, #dbe7f4 48%, #d2dcf0 100%);
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      overflow-x: hidden;
    }

    /* 主外框容器：還原圓角、白邊與淡冰藍漸層底色 */
    .app-frame {
      background: linear-gradient(180deg, #eef5fc 0%, #e7f1fa 100%);
      border: 2.5px solid #ffffff;
      border-radius: 26px;
      box-shadow: 
        0 20px 45px rgba(25, 55, 95, 0.12),
        0 4px 12px rgba(25, 55, 95, 0.06);
      width: 100%;
      max-width: 980px;
      min-height: 610px;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 2.75rem 2rem 2.5rem;
      transition: all 0.35s ease;
    }

    /* 標題字體微調 */
    .title-main {
      color: var(--navy-dark);
      font-weight: 800;
      letter-spacing: 0.07em;
      line-height: 1.05;
    }

    .title-sub {
      color: var(--blue-sub);
      font-style: italic;
      font-weight: 700;
      letter-spacing: 0.015em;
    }

    /* 主頁書本立體陰影與傾斜互動 */
    .book-cover-card {
      width: 175px;
      height: 238px;
      border-radius: 16px;
      box-shadow: 0 12px 24px rgba(16, 45, 76, 0.18);
      transition: transform 0.32s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.32s ease;
      cursor: pointer;
      user-select: none;
      position: relative;
      overflow: hidden;
      background: #fff;
    }

    @media (min-width: 768px) {
      .book-cover-card {
        width: 192px;
        height: 260px;
      }
    }

    .book-tilt-1 {
      transform: rotate(-3.5deg);
    }
    .book-tilt-2 {
      transform: rotate(0.8deg) translateY(-4px);
    }
    .book-tilt-3 {
      transform: rotate(2.8deg);
    }

    .book-cover-card:hover {
      transform: rotate(0deg) translateY(-12px) scale(1.04);
      box-shadow: 0 20px 32px rgba(16, 45, 76, 0.25);
      z-index: 10;
    }

    /* 第二頁：橫式書本選擇卡片（左側色條與淡色外框） */
    .book-select-card {
      background: #ffffff;
      border-radius: 18px;
      padding: 1.15rem 1.2rem 1.15rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      position: relative;
      text-align: left;
    }

    .book-select-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 14px 28px rgba(16, 45, 76, 0.11);
    }

    .card-book-1 {
      border: 1.5px solid #fbd6c0;
      border-left: 7px solid var(--book1-color);
      box-shadow: 0 6px 16px rgba(239, 108, 36, 0.06);
    }

    .card-book-2 {
      border: 1.5px solid #bce0f7;
      border-left: 7px solid var(--book2-color);
      box-shadow: 0 6px 16px rgba(9, 118, 188, 0.06);
    }

    .card-book-3 {
      border: 1.5px solid #f9c4df;
      border-left: 7px solid var(--book3-color);
      box-shadow: 0 6px 16px rgba(230, 28, 121, 0.06);
    }

    /* 膠囊型白色按鈕（START 與 回到主頁） */
    .pill-btn {
      background: #ffffff;
      color: var(--navy-dark);
      border: 1.5px solid #dce6f2;
      border-radius: 9999px;
      box-shadow: 0 6px 16px rgba(16, 45, 76, 0.08);
      transition: all 0.22s ease;
    }

    .pill-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 22px rgba(16, 45, 76, 0.13);
      background: #fcfdff;
    }

    .pill-btn:active {
      transform: translateY(0px);
    }

    /* 頁面切換淡入動畫 */
    .view-section {
      animation: fadeIn 0.32s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* 題目選項樣式 */
    .option-btn {
      transition: all 0.2s ease;
    }
    .option-btn:hover:not(:disabled) {
      transform: translateX(4px);
    }
  </style>
</head>
<body>

  <!-- 網站主容器 -->
  <main class="app-frame">

    <!-- ==================== 共用頂部標題區 (與圖片一致) ==================== -->
    <header class="flex flex-col items-center justify-center select-none pt-1">
      <div class="flex items-center justify-center gap-3 sm:gap-5">
        <!-- 左側圓弧括號 -->
        <svg class="w-4 h-14 sm:w-5 sm:h-16 text-[#9ab0c7]" viewBox="0 0 24 72" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M19 4C6 18 6 54 19 68" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
        </svg>

        <div class="text-center">
          <h1 class="title-main text-3xl sm:text-5xl tracking-wider">GRAMMAR</h1>
          <p class="title-sub text-lg sm:text-2xl mt-1">for young learners</p>
        </div>

        <!-- 右側圓弧括號 -->
        <svg class="w-4 h-14 sm:w-5 sm:h-16 text-[#9ab0c7]" viewBox="0 0 24 72" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M5 4C18 18 18 54 5 68" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
        </svg>
      </div>

      <!-- 標題下方微弧裝飾線 -->
      <svg class="w-64 sm:w-80 h-4 mt-1 text-[#cedbe8]" viewBox="0 0 320 14" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M10 11C105 2 215 2 310 11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </header>

    <!-- ==================== 畫面 1：主頁 (3本書封面 + START) ==================== -->
    <section id="home-view" class="view-section flex-1 flex flex-col items-center justify-between my-4">
      <!-- 3 本書封面排列區 -->
      <div class="flex-1 flex flex-wrap items-center justify-center gap-6 sm:gap-9 md:gap-11 py-6 px-2">
        <!-- 由 JavaScript 根據 booksConfig 自動產生 3 本書封面 -->
        <div id="home-books-container" class="flex flex-wrap items-center justify-center gap-6 sm:gap-9 md:gap-10"></div>
      </div>

      <!-- 底部 START 按鈕 -->
      <div class="pt-2 pb-1">
        <button 
          onclick="showMenuView()" 
          class="pill-btn px-16 sm:px-20 py-3.5 text-lg sm:text-xl font-extrabold tracking-[0.14em]"
        >
          START
        </button>
      </div>
    </section>

    <!-- ==================== 畫面 2：選書目錄頁 (3本書介紹卡 + 回到主頁) ==================== -->
    <section id="menu-view" class="view-section hidden flex-1 flex flex-col items-center justify-between my-4">
      <!-- 3 本書橫式卡片區 -->
      <div class="w-full flex-1 flex items-center justify-center py-6 px-1 sm:px-4">
        <div id="menu-books-container" class="grid grid-cols-1 lg:grid-cols-3 gap-5 sm:gap-6 w-full max-w-4xl">
          <!-- 由 JavaScript 自動渲染 3 張書本卡片 -->
        </div>
      </div>

      <!-- 底部「← 回到主頁」按鈕 -->
      <div class="pt-2 pb-1">
        <button 
          onclick="showHomeView()" 
          class="pill-btn px-8 py-2.5 text-sm sm:text-base font-bold text-[#2c435e] flex items-center gap-2"
        >
          <span>←</span>
          <span>回到主頁</span>
        </button>
      </div>
    </section>

    <!-- ==================== 畫面 3：題庫畫面 (目前顯示：題庫還在製作中) ==================== -->
    <section id="quiz-view" class="view-section hidden flex-1 flex flex-col justify-between my-4 w-full max-w-2xl mx-auto">
      
      <!-- 中間：題庫製作中提示卡片 -->
      <div class="flex-1 flex items-center justify-center py-6 px-2">
        <div class="w-full bg-white rounded-3xl p-10 sm:p-14 shadow-md border border-slate-100 flex flex-col items-center justify-center text-center">
          <span 
            id="quiz-book-badge" 
            class="px-5 py-1.5 rounded-full text-white text-sm sm:text-base font-extrabold tracking-wide mb-5 shadow-sm"
          >
            Book 1
          </span>

          <h2 class="text-2xl sm:text-3xl font-extrabold text-[#102d4c] tracking-wide">
            題庫還在製作中
          </h2>
        </div>
      </div>

      <!-- 底部返回選書按鈕 -->
      <div class="pt-2 pb-1 flex justify-center">
        <button 
          onclick="showMenuView()" 
          class="pill-btn px-8 py-2.5 text-sm sm:text-base font-bold text-[#2c435e] flex items-center gap-2"
        >
          <span>←</span>
          <span>返回選書</span>
        </button>
      </div>
    </section>

  </main>

  <script>
    /* =========================================================================
     * 【1. 書本設定與圖片路徑區】
     * 您之後拿到 3 本書的圖片後，只需要將圖片路徑填入下方 `coverImage` 欄位即可！
     * 例如：coverImage: "images/book1.png"
     * ========================================================================= */
    const booksConfig = [
      {
        id: 1,
        title: "Book 1",
        themeColor: "#ef6c24",
        cardClass: "card-book-1",
        tiltClass: "book-tilt-1",
        // 👇 之後請將這裡換成您的第一本書圖片檔名或網址（例如 "images/book1.png"）
        coverImage: ""
      },
      {
        id: 2,
        title: "Book 2",
        themeColor: "#0976bc",
        cardClass: "card-book-2",
        tiltClass: "book-tilt-2",
        // 👇 之後請將這裡換成您的第二本書圖片檔名或網址（例如 "images/book2.png"）
        coverImage: ""
      },
      {
        id: 3,
        title: "Book 3",
        themeColor: "#e61c79",
        cardClass: "card-book-3",
        tiltClass: "book-tilt-3",
        // 👇 之後請將這裡換成您的第三本書圖片檔名或網址（例如 "images/book3.png"）
        coverImage: ""
      }
    ];

    /* =========================================================================
     * 【2. 題庫預留區】
     * 之後提供題庫時可直接填入對應的書本編號 (1, 2, 3)
     * ========================================================================= */
    const questionBanks = {
      1: [],
      2: [],
      3: []
    };

    /* =========================================================================
     * 【3. 乾淨簡潔的預設書本封面 (無卡通圖案，僅保留純色質感與編號)】
     * 當您填入 `coverImage` 圖片路徑後，就會自動顯示您的圖片。
     * ========================================================================= */
    function renderBookCoverElement(book) {
      const cleanPlaceholder = `
        <div 
          class="w-full h-full flex flex-col items-center justify-center p-3 text-white select-none"
          style="background: linear-gradient(145deg, ${book.themeColor} 0%, ${book.themeColor}dd 100%);"
        >
          <span class="text-[11px] sm:text-xs font-bold uppercase tracking-widest opacity-85">Grammar</span>
          <span class="text-3xl sm:text-4xl font-black mt-1">${book.id}</span>
        </div>
      `;

      if (book.coverImage && book.coverImage.trim() !== "") {
        return `
          <div class="w-full h-full relative">
            <img 
              src="${book.coverImage}" 
              alt="${book.title}" 
              class="w-full h-full object-cover"
              onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
            />
            <div style="display:none;" class="w-full h-full">${cleanPlaceholder}</div>
          </div>
        `;
      }
      return cleanPlaceholder;
    }

    /* =========================================================================
     * 【4. 渲染主頁 (Screen 1) 與 選書頁 (Screen 2)】
     * ========================================================================= */
    function initViews() {
      // 渲染主頁的 3 本書封面
      const homeContainer = document.getElementById("home-books-container");
      homeContainer.innerHTML = booksConfig.map(book => `
        <div 
          onclick="showMenuView()" 
          class="book-cover-card ${book.tiltClass}"
          title="${book.title}"
        >
          ${renderBookCoverElement(book)}
        </div>
      `).join("");

      // 渲染第二頁（選書頁）的 3 張橫向書本卡片（不含簡介，僅顯示縮圖與 Book 1~3）
      const menuContainer = document.getElementById("menu-books-container");
      menuContainer.innerHTML = booksConfig.map(book => `
        <button 
          type="button"
          onclick="startBookQuiz(${book.id})" 
          class="book-select-card ${book.cardClass} w-full py-5 px-6"
        >
          <!-- 左側乾淨小書封縮圖 -->
          <div class="w-16 h-22 sm:w-[68px] sm:h-[92px] rounded-xl overflow-hidden shadow-sm shrink-0">
            ${renderBookCoverElement(book)}
          </div>

          <!-- 右側僅顯示書名 (Book 1 / Book 2 / Book 3) -->
          <div class="flex-1 flex items-center pl-2">
            <h3 class="text-2xl sm:text-3xl font-extrabold tracking-wide" style="color: ${book.themeColor};">
              ${book.title}
            </h3>
          </div>
        </button>
      `).join("");
    }

    /* =========================================================================
     * 【5. 頁面切換邏輯】
     * ========================================================================= */
    const homeView = document.getElementById("home-view");
    const menuView = document.getElementById("menu-view");
    const quizView = document.getElementById("quiz-view");

    function showHomeView() {
      homeView.classList.remove("hidden");
      menuView.classList.add("hidden");
      quizView.classList.add("hidden");
    }

    function showMenuView() {
      homeView.classList.add("hidden");
      menuView.classList.remove("hidden");
      quizView.classList.add("hidden");
    }

    function startBookQuiz(bookId) {
      const book = booksConfig.find(b => b.id === bookId);

      homeView.classList.add("hidden");
      menuView.classList.add("hidden");
      quizView.classList.remove("hidden");

      const badge = document.getElementById("quiz-book-badge");
      badge.textContent = book.title;
      badge.style.backgroundColor = book.themeColor;
    }

    // 初始化渲染
    window.onload = function () {
      initViews();
    };
  </script>
</body>
</html>
